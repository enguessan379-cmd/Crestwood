<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Configurações — Crestwood Roleplay</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#f7fbff;background:transparent}body{background:rgba(0,0,0,.44);backdrop-filter:blur(8px) brightness(.58);-webkit-backdrop-filter:blur(8px) brightness(.58)}.screen{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.panel{width:min(1015px,82vw);height:min(548px,76vh);background:rgba(8,9,11,.78);box-shadow:0 16px 58px #000b;display:grid;grid-template-rows:46px 43px 1fr;border-top:1px solid rgba(255,255,255,.14)}.brand{padding:12px 0 0 0;font-size:24px;font-weight:400;color:#f4f8fb;text-shadow:0 2px 4px #000}.top-tabs{display:grid;grid-template-columns:repeat(6,1fr);background:rgba(0,0,0,.48);border-top:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,255,255,.16)}.tab{border:0;border-right:1px solid rgba(255,255,255,.15);background:transparent;color:#e9eff4;font-size:12px;text-transform:uppercase;letter-spacing:.3px}.tab.active{background:#f9fafb;color:#20262b}.tab.exit{color:#f2a1a1}.layout{display:grid;grid-template-columns:338px 1fr;min-height:0}.side{padding-top:2px;background:rgba(5,5,6,.48);border-right:1px solid rgba(255,255,255,.12)}.side button{width:100%;height:34px;border:0;border-bottom:1px solid rgba(255,255,255,.08);padding-left:12px;text-align:left;color:#edf5fa;background:rgba(20,20,22,.72);font-size:14px}.side button.active{background:#f7f7f7;color:#242424}.content{padding:0 13px;overflow:auto;background:rgba(8,8,10,.35)}.section{display:none;padding:14px 0}.section.active{display:block}.line{display:grid;grid-template-columns:1fr auto;gap:24px;min-height:34px;align-items:center;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px}.line-title{font-weight:500}.value{color:#e8edf0;font-size:14px}.control{display:flex;gap:8px;align-items:center}.choice{min-width:82px;padding:8px 10px;border:1px solid rgba(255,255,255,.28);background:#11171b;color:#eff7fc;font-size:13px}.choice.active{background:#f7f7f7;color:#20252a;border-color:#fff}.slider{width:98px;accent-color:#1e9ee8}.heading{font-size:15px;letter-spacing:.4px;margin:8px 0 10px;color:#d8e0e5;text-transform:uppercase}.footer{height:30px;display:flex;justify-content:flex-end;gap:8px;align-items:center;border-top:1px solid rgba(255,255,255,.12)}.back{border:0;background:transparent;color:#dceaf1;font-size:13px;margin-right:6px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#0b1720e8;border:1px solid #58b8e7;color:#fff;border-radius:6px;padding:10px 18px;opacity:0;transition:opacity .18s}.toast.show{opacity:1}@media(max-width:700px){.panel{width:94vw;height:82vh}.layout{grid-template-columns:34% 66%}.brand{font-size:18px}.tab{font-size:9px}.side button{font-size:12px}.line{grid-template-columns:1fr}.choice{min-width:54px;padding:7px 6px}}
</style>
</head>
<body>
<main class="screen"><section class="panel" aria-label="Configurações Crestwood">
  <header class="brand">Crestwood Roleplay</header>
  <nav class="top-tabs"><button class="tab" data-top="mapa">Mapa</button><button class="tab" data-top="controles">Controles</button><button class="tab" data-top="jogo">Jogo</button><button class="tab" data-top="audio">Áudio</button><button class="tab active" data-top="configuracoes">Configurações</button><button class="tab exit" data-action="close">SAMP</button></nav>
  <div class="layout"><aside class="side"><button class="active" data-section="graficos">Gráficos</button><button data-section="tela">Tela</button><button data-section="batepapo">Bate-papo</button></aside>
    <div class="content">
      <section id="graficos" class="section active"><div class="heading">Gráficos</div><div class="line"><span class="line-title">Modo otimizado</span><div class="control"><button class="choice active" data-setting="performance" data-value="balanced">Equilibrado</button><button class="choice" data-setting="performance" data-value="performance">Desempenho</button></div></div><div class="line"><span class="line-title">Exibir FPS</span><div class="control"><button class="choice active" data-setting="fps" data-value="true">Ativado</button><button class="choice" data-setting="fps" data-value="false">Desativado</button></div></div><div class="line"><span class="line-title">Distância de visão</span><input class="slider" data-setting="draw-distance" type="range" min="1" max="100" value="65"></div></section>
      <section id="tela" class="section"><div class="heading">Tela</div><div class="line"><span class="line-title">Proporção</span><div class="control"><button class="choice" data-setting="aspect" data-value="5:4">5:4</button><button class="choice" data-setting="aspect" data-value="16:10">16:10</button><button class="choice active" data-setting="aspect" data-value="16:9">16:9 (Normal)</button><button class="choice" data-setting="aspect" data-value="4:3">4:3</button></div></div><div class="line"><span class="line-title">Resolução</span><div class="value">2280×1080 (100%)</div></div><div class="line"><span class="line-title">Escala da resolução</span><input class="slider" data-setting="resolution-scale" type="range" min="50" max="100" value="100"></div><div class="line"><span class="line-title">Mostrar FPS</span><div class="control"><button class="choice active" data-setting="fps" data-value="true">Ativado</button><button class="choice" data-setting="fps" data-value="false">Desativado</button></div></div><div class="line"><span class="line-title">Restaurar padrões</span><button class="choice" data-action="reset">Restaurar</button></div></section>
      <section id="batepapo" class="section"><div class="heading">Bate-papo</div><div class="line"><span class="line-title">Exibir mensagens do servidor</span><div class="control"><button class="choice active" data-setting="server-chat" data-value="true">Ativado</button><button class="choice" data-setting="server-chat" data-value="false">Desativado</button></div></div><div class="line"><span class="line-title">Escala do chat</span><input class="slider" data-setting="chat-scale" type="range" min="70" max="140" value="100"></div><div class="line"><span class="line-title">Restaurar padrões</span><button class="choice" data-action="reset">Restaurar</button></div></section>
    </div>
  </div><footer class="footer"><button class="back" data-action="close">VOLTAR AO JOGO</button></footer>
</section></main><div class="toast" id="toast"></div>
<script>
(function(){var toast=document.getElementById('toast'),timer=0;function send(a,p){try{window.AndroidHUD&&window.AndroidHUD.onHudAction&&window.AndroidHUD.onHudAction(a,p||'{}')}catch(e){}}function notice(t){toast.textContent=t;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(function(){toast.classList.remove('show')},1200)}function settingName(key){return key==='aspect'?'settings:aspect':key==='resolution'?'settings:resolution':key==='resolution-scale'?'settings:resolution-scale':key==='fps'?'settings:fps':'settings:toggle'}document.querySelectorAll('[data-section]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-section]').forEach(function(x){x.classList.remove('active')});document.querySelectorAll('.section').forEach(function(x){x.classList.remove('active')});b.classList.add('active');document.getElementById(b.dataset.section).classList.add('active')}});document.querySelectorAll('[data-setting]').forEach(function(c){c.onchange=function(){send(settingName(c.dataset.setting),JSON.stringify({key:c.dataset.setting,value:c.value}));notice('Configuração atualizada')};c.onclick=function(){if(!c.classList.contains('choice'))return;document.querySelectorAll('[data-setting="'+c.dataset.setting+'"]').forEach(function(x){x.classList.remove('active')});c.classList.add('active');send(settingName(c.dataset.setting),JSON.stringify({key:c.dataset.setting,value:c.dataset.value}));notice('Configuração atualizada')}});document.querySelectorAll('[data-top]').forEach(function(t){t.onclick=function(){send('settings:tab',JSON.stringify({tab:t.dataset.top}));notice(t.textContent+' selecionado')}});document.querySelectorAll('[data-action="close"]').forEach(function(b){b.onclick=function(){send('settings:close','{}')}});document.querySelector('[data-action="reset"]').onclick=function(){send('settings:reset','{}');notice('Padrões restaurados')}}());
</script>
</body></html>
