<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Actions de police Crestwood</title>
    <link rel="stylesheet" href="police.css">
</head>
<body>
<main class="pl" id="pl">
    <section class="pl-panel">
        <header class="pl-head">
            <div class="pl-title">
                <span class="pl-dot"></span>
                <div>
                    <h1>Actions de police<span class="pl-period">.</span></h1>
                    <p id="plRank">Grade : —</p>
                </div>
            </div>
            <div class="pl-target" id="plTarget">
                <small>Cible</small>
                <strong id="plTargetName">—</strong>
            </div>
            <div class="pl-flags" id="plFlags"></div>
            <button class="pl-close" id="plClose" type="button" aria-label="Fermer">&#10005;</button>
        </header>

        <div class="pl-body">
            <nav class="pl-actions" aria-label="Actions">
                <div class="pl-group">
                    <h3>Contrôle</h3>
                    <button class="pl-act" id="plId" type="button"><i>&#9633;</i>Carte d'identité</button>
                    <button class="pl-act" id="plPapers" type="button"><i>&#9776;</i>Papiers &amp; casier</button>
                    <button class="pl-act" id="plSearch" type="button"><i>&#9906;</i>Fouiller</button>
                </div>
                <div class="pl-group">
                    <h3>Maîtrise</h3>
                    <button class="pl-act" id="plCuff" type="button"><i>&#9901;</i><span>Menotter</span></button>
                    <button class="pl-act" id="plDrag" type="button"><i>&#10142;</i><span>Traîner</span></button>
                </div>
                <div class="pl-group">
                    <h3>Justice</h3>
                    <button class="pl-act" id="plLicense" type="button"><i>&#9940;</i><span>Retirer le permis</span></button>
                    <button class="pl-act" id="plFine" type="button"><i>$</i>Amende</button>
                    <button class="pl-act" id="plCharge" type="button"><i>&#9878;</i>Inculper</button>
                    <button class="pl-act danger" id="plArrest" type="button"><i>&#9632;</i>Arrêter</button>
                </div>
            </nav>

            <section class="pl-detail" id="plDetail" aria-live="polite"></section>
        </div>

        <div class="pl-toast hidden" id="plToast" role="status"></div>
    </section>
</main>
<script src="police.js"></script>
</body>
</html>
