<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Administration Crestwood</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="adm" id="adm">
    <section class="adm-panel">
        <header class="adm-head">
            <div class="adm-title">
                <span class="adm-dot"></span>
                <div>
                    <h1>Administration<span class="adm-period">.</span></h1>
                    <p id="admCount">0 joueur en ligne</p>
                </div>
            </div>
            <span class="adm-role" id="admRole">—</span>
            <nav class="adm-tabs" aria-label="Sections">
                <button class="adm-tab active" type="button" data-tab="players">Joueurs</button>
                <button class="adm-tab" type="button" data-tab="factions">Factions</button>
                <button class="adm-tab" type="button" data-tab="server">Serveur</button>
                <button class="adm-tab" type="button" data-tab="staff">Staff</button>
            </nav>
            <button class="adm-refresh" id="admRefresh" type="button" aria-label="Actualiser">&#8635;</button>
            <button class="adm-close" id="admClose" type="button" aria-label="Fermer">&#10005;</button>
        </header>

        <div class="adm-body" id="tabPlayers">
            <aside class="adm-list-wrap">
                <input class="adm-search" id="admSearch" type="text" placeholder="Rechercher un joueur ou un ID" autocomplete="off" autocapitalize="off">
                <div class="adm-list" id="admList"></div>
            </aside>
            <section class="adm-detail" id="admDetail"></section>
        </div>

        <div class="adm-body adm-server hidden" id="tabFactions">
            <div class="adm-cards" id="admFactions"></div>
        </div>

        <div class="adm-body adm-server hidden" id="tabServer">
            <div class="adm-cards" id="admServer"></div>
        </div>

        <div class="adm-body adm-server hidden" id="tabStaff">
            <div class="adm-cards" id="admStaff"></div>
        </div>

        <div class="adm-toast hidden" id="admToast" role="status"></div>
    </section>

    <div class="adm-modal hidden" id="admModal">
        <div class="adm-modal-card">
            <h2 id="admModalTitle"></h2>
            <p id="admModalText"></p>
            <input class="adm-input" id="admModalInput" type="text" autocomplete="off">
            <div class="adm-choices hidden" id="admModalChoices"></div>
            <div class="adm-modal-actions">
                <button class="adm-btn ghost" id="admModalCancel" type="button">Annuler</button>
                <button class="adm-btn primary" id="admModalOk" type="button">Valider</button>
            </div>
        </div>
    </div>
</main>
<script src="admin.js"></script>
</body>
</html>
