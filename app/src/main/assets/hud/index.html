<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SAMP Mobile HUD</title>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<svg id="hudSvg" viewBox="0 0 1520 720" preserveAspectRatio="none" aria-label="HUD">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="1.5" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".7"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".20"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient>
    <linearGradient id="actionGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4b47" stop-opacity=".58"/>
      <stop offset="1" stop-color="#0d211f" stop-opacity=".42"/>
    </linearGradient>
    <symbol id="menuIcon" viewBox="0 0 32 32"><path d="M5 9h22M5 16h22M5 23h22" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></symbol>
    <symbol id="dotsIcon" viewBox="0 0 32 32"><circle cx="16" cy="5" r="2.5" fill="#fff"/><circle cx="25" cy="10" r="2.5" fill="#fff"/><circle cx="27" cy="20" r="2.5" fill="#fff"/><circle cx="20" cy="27" r="2.5" fill="#fff"/><circle cx="10" cy="27" r="2.5" fill="#fff"/><circle cx="5" cy="18" r="2.5" fill="#fff"/><circle cx="7" cy="9" r="2.5" fill="#fff"/></symbol>
    <symbol id="chatIcon" viewBox="0 0 32 32"><path d="M5 7.5h22a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H15l-7 4v-4H5a3 3 0 0 1-3-3v-10a3 3 0 0 1 3-3Z" fill="#fff"/></symbol>
    <symbol id="playerActionIcon" viewBox="0 0 32 32"><circle cx="16" cy="10" r="5.5" fill="#fff"/><path d="M6 28c.8-6.1 4.4-9.1 10-9.1S25.2 21.9 26 28Z" fill="#fff"/></symbol>
    <symbol id="ringActionIcon" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round"><path d="M16 4v4"/><path d="M24.5 7.5l-2.8 2.8"/><path d="M28 16h-4"/><path d="M24.5 24.5l-2.8-2.8"/><path d="M16 28v-4"/><path d="M7.5 24.5l2.8-2.8"/><path d="M4 16h4"/><path d="M7.5 7.5l2.8 2.8"/></g></symbol>
    <symbol id="carActionIcon" viewBox="0 0 32 32"><path d="m7.2 14 3-6h11.6l3 6 2.5 2.6V24h-3.4v2.5h-3V24h-9.8v2.5h-3V24H4.7v-7.4L7.2 14Zm3.8-2.5-1.5 3h13l-1.5-3H11Zm-.6 6.1a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm11.2 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z" fill="#fff"/></symbol>
    <symbol id="crossIcon" viewBox="0 0 32 32"><circle cx="16" cy="16" r="8.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M16 2v28M2 16h28" stroke="#fff" stroke-width="2"/></symbol>
    <symbol id="clockIcon" viewBox="0 0 32 32"><circle cx="16" cy="16" r="9.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M16 10v7h5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="stackIcon" viewBox="0 0 32 32"><path d="m16 5 11 5-11 5L5 10l11-5Zm-11 9 11 5 11-5M5 19l11 5 11-5" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="plusIcon" viewBox="0 0 32 32"><circle cx="16" cy="16" r="9" fill="none" stroke="#fff" stroke-width="2"/><path d="M16 11v10M11 16h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="heartIcon" viewBox="0 0 40 40"><path d="M20 34S5 25 5 14c0-5 3-8 7-8 4 0 7 3 8 6 1-3 4-6 8-6 4 0 7 3 7 8 0 11-15 20-15 20Z" fill="#fff" stroke="#fff" stroke-width="1.5"/></symbol>
    <symbol id="shieldIcon" viewBox="0 0 40 40"><path d="M20 5 32 9v9c0 8-5 13-12 17C13 31 8 26 8 18V9l12-4Z" fill="none" stroke="#fff" stroke-width="3"/><path d="M14 20h12" stroke="#fff" stroke-width="3"/></symbol>
    <symbol id="dropIcon" viewBox="0 0 40 40"><path d="M20 5S10 17 10 24a10 10 0 0 0 20 0C30 17 20 5 20 5Z" fill="#fff"/></symbol>
    <symbol id="foodIcon" viewBox="0 0 40 40"><path d="M12 5v12M8 5v12M16 5v12M8 17h8M12 17v18M27 5v30M27 5c5 3 5 10 0 13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="boltIcon" viewBox="0 0 40 40"><path d="M24 3 9 22h10l-3 15 15-21H21l3-13Z" fill="#fff"/></symbol>
  </defs>
  <image id="brandLogo" href="crestwood-roleplay.png" x="625" y="10" width="270" height="90" preserveAspectRatio="xMidYMid meet" opacity=".98" filter="url(#shadow)" aria-label="Crestwood Roleplay"/>
  <g id="leftActions" class="clickable" filter="url(#shadow)">
    <g data-action="menu" aria-label="Configurações"><rect x="80" y="238" width="68" height="68" rx="18" class="reference-action-button"/><rect x="84" y="242" width="60" height="20" rx="10" class="action-sheen"/><use href="#dotsIcon" x="99" y="257" width="30" height="30"/></g>
    <g data-action="target" aria-label="Roleta"><rect x="164" y="238" width="68" height="68" rx="18" class="reference-action-button"/><rect x="168" y="242" width="60" height="20" rx="10" class="action-sheen"/><use href="#ringActionIcon" x="183" y="257" width="30" height="30"/></g>
    <g data-action="chat" aria-label="Chat"><rect x="248" y="238" width="68" height="68" rx="18" class="reference-action-button"/><rect x="252" y="242" width="60" height="20" rx="10" class="action-sheen"/><use href="#carActionIcon" x="267" y="257" width="30" height="30"/></g>
  </g>
  <g id="interactionWheel" class="wheel" display="none" aria-label="Roda de interação">
    <circle cx="760" cy="360" r="285" class="wheel-ring"/>
    <circle cx="760" cy="360" r="110" class="wheel-mid"/>
    <circle cx="760" cy="360" r="110" class="wheel-center"/>
    <path d="M760 75V645M475 360H1045M558.5 158.5L961.5 561.5M961.5 158.5L558.5 561.5" class="wheel-divider"/>
    <circle cx="760" cy="360" r="285" class="wheel-outline"/>
    <g class="wheel-item" data-wheel="celular"><circle cx="760" cy="145" r="23"/><text x="760" y="152" class="wheel-icon" text-anchor="middle">⌕</text><text x="760" y="201" class="wheel-label" text-anchor="middle">Celular</text></g>
    <g class="wheel-item" data-wheel="blazer"><circle cx="915" cy="205" r="23"/><text x="915" y="212" class="wheel-icon" text-anchor="middle">B</text><text x="915" y="249" class="wheel-label" text-anchor="middle">Blazer</text></g>
    <g class="wheel-item" data-wheel="missoes"><circle cx="978" cy="360" r="23"/><text x="978" y="367" class="wheel-icon" text-anchor="middle">≡</text><text x="978" y="414" class="wheel-label" text-anchor="middle">Missões</text></g>
    <g class="wheel-item" data-wheel="loja"><circle cx="915" cy="515" r="23"/><text x="915" y="522" class="wheel-icon" text-anchor="middle">▾</text><text x="915" y="570" class="wheel-label" text-anchor="middle">Loja</text></g>
    <g class="wheel-item" data-wheel="favoritos"><circle cx="760" cy="578" r="23"/><text x="760" y="585" class="wheel-icon" text-anchor="middle">★</text><text x="760" y="630" class="wheel-label" text-anchor="middle">Anim. Favoritas</text></g>
    <g class="wheel-item" data-wheel="ajuda"><circle cx="605" cy="515" r="23"/><text x="605" y="522" class="wheel-icon" text-anchor="middle">?</text><text x="605" y="570" class="wheel-label" text-anchor="middle">Ajuda</text></g>
    <g class="wheel-item" data-wheel="jogador"><circle cx="542" cy="360" r="23"/><text x="542" y="367" class="wheel-icon" text-anchor="middle">●</text><text x="542" y="414" class="wheel-label" text-anchor="middle">Jogador</text></g>
    <g class="wheel-item" data-wheel="reportar"><circle cx="605" cy="205" r="23"/><text x="605" y="212" class="wheel-icon" text-anchor="middle">?</text><text x="605" y="249" class="wheel-label" text-anchor="middle">Reportar</text></g>
  </g>
  <g id="needs" class="clickable" filter="url(#shadow)">
    <g id="healthNeed" data-action="health"><rect id="healthCard" x="522" y="650" width="40" height="40" rx="8" fill="#ef3b2f"/><rect id="healthDrain" x="522" y="650" width="40" height="0" fill="#000" opacity=".62"/><use id="healthIcon" href="#heartIcon" x="528" y="656" width="28" height="28"/></g>
    <g id="armorNeed" data-action="armor"><rect id="armorCard" x="570" y="650" width="40" height="40" rx="8" fill="#171b21"/><rect id="armorDrain" x="570" y="650" width="40" height="0" fill="#000" opacity=".62"/><use href="#shieldIcon" x="576" y="656" width="28" height="28"/></g>
    <g id="waterNeed" data-action="water"><rect id="waterCard" x="618" y="650" width="40" height="40" rx="8" fill="#0c9de5"/><rect id="waterDrain" x="618" y="650" width="40" height="0" fill="#000" opacity=".62"/><use href="#dropIcon" x="624" y="656" width="28" height="28"/></g>
    <g id="foodNeed" data-action="food"><rect id="foodCard" x="666" y="650" width="40" height="40" rx="8" fill="#f39800"/><rect id="foodDrain" x="666" y="650" width="40" height="0" fill="#000" opacity=".62"/><use href="#foodIcon" x="672" y="656" width="28" height="28"/></g>
    <g id="energyNeed" data-action="energy"><rect id="energyCard" x="714" y="650" width="40" height="40" rx="8" fill="#911ce3"/><rect id="energyDrain" x="714" y="650" width="40" height="0" fill="#000" opacity=".62"/><use id="energyIcon" href="#boltIcon" x="720" y="656" width="28" height="28"/></g>
  </g>
  <text x="85" y="695" class="hud-text fps">FPS: <tspan id="fps">120</tspan></text>
  <text id="toast" x="760" y="580" class="toast" text-anchor="middle"></text>
</svg>
<script src="hud.js"></script>
</body>
</html>
