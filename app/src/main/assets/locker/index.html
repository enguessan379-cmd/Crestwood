<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vestiaire Crestwood</title>
    <link rel="stylesheet" href="locker.css">
</head>
<body>
<main class="lk" id="lk">
    <section class="lk-panel">
        <header class="lk-head">
            <div class="lk-title">
                <span class="lk-dot"></span>
                <div>
                    <h1>Vestiaire <span id="lkFac">Police</span><span class="lk-period">.</span></h1>
                    <p id="lkRank">Grade : —</p>
                </div>
            </div>
            <span class="lk-state" id="lkState">Tenue civile</span>
            <button class="lk-close" id="lkClose" type="button" aria-label="Fermer">&#10005;</button>
        </header>

        <div class="lk-body">
            <aside class="lk-preview" aria-label="Aperçu de la tenue">
                <svg id="lkFigure" viewBox="0 0 120 210" role="img" aria-label="Aperçu">
                    <g id="lkLegs">
                        <rect x="40" y="128" width="17" height="70" rx="5" fill="#101b3a"/>
                        <rect x="63" y="128" width="17" height="70" rx="5" fill="#101b3a"/>
                        <rect x="38" y="190" width="21" height="9" rx="4" fill="#05070d"/>
                        <rect x="61" y="190" width="21" height="9" rx="4" fill="#05070d"/>
                    </g>
                    <g id="lkArms">
                        <rect x="22" y="62" width="14" height="58" rx="7" fill="#1d3f8f"/>
                        <rect x="84" y="62" width="14" height="58" rx="7" fill="#1d3f8f"/>
                        <circle cx="29" cy="123" r="7" fill="#e0b48e"/>
                        <circle cx="91" cy="123" r="7" fill="#e0b48e"/>
                    </g>
                    <path id="lkTorso" d="M36 62 Q60 54 84 62 L82 130 L38 130 Z" fill="#2561f0"/>
                    <g id="lkVest" class="lk-part">
                        <path d="M40 64 Q60 58 80 64 L79 118 L41 118 Z" fill="#0b1531" stroke="#3b82ff" stroke-width="1.4"/>
                        <rect x="48" y="72" width="24" height="10" rx="2" fill="#16275a"/>
                        <rect x="48" y="88" width="24" height="10" rx="2" fill="#16275a"/>
                    </g>
                    <g id="lkBelt" class="lk-part">
                        <rect x="37" y="118" width="46" height="9" rx="2" fill="#05070d"/>
                        <rect x="56" y="118" width="8" height="9" rx="1.5" fill="#ffb454"/>
                        <rect x="43" y="115" width="7" height="16" rx="2" fill="#16275a"/>
                    </g>
                    <circle cx="60" cy="40" r="17" fill="#e0b48e"/>
                    <g id="lkHair"><path d="M43 38 Q44 20 60 20 Q76 20 77 38 Q70 28 60 28 Q50 28 43 38 Z" fill="#3a2a1d"/></g>
                    <g id="lkPony" class="lk-part"><path d="M74 30 Q92 34 88 62 Q82 46 72 40 Z" fill="#3a2a1d"/></g>
                    <g id="lkHat" class="lk-part">
                        <path d="M41 33 Q42 14 60 14 Q78 14 79 33 Z" fill="#0b1531" stroke="#3b82ff" stroke-width="1.4"/>
                        <rect x="38" y="30" width="44" height="6" rx="3" fill="#05070d"/>
                        <circle cx="60" cy="24" r="3.2" fill="#ffb454"/>
                    </g>
                </svg>
                <p class="lk-preview-note" id="lkPreviewNote">Aperçu</p>
            </aside>

            <section class="lk-options">
                <div class="lk-card">
                    <h3>Modèle</h3>
                    <div class="lk-seg" id="lkGender">
                        <button type="button" class="lk-seg-btn" data-v="0">Homme</button>
                        <button type="button" class="lk-seg-btn" data-v="1">Femme</button>
                    </div>
                </div>

                <div class="lk-card">
                    <h3>Équipement</h3>
                    <div class="lk-toggles" id="lkToggles"></div>
                    <div class="lk-chips" id="lkPresets"></div>
                </div>

                <div class="lk-actions">
                    <button class="lk-btn primary" id="lkWear" type="button">Enfiler la tenue de service</button>
                    <button class="lk-btn" id="lkCivil" type="button">Reprendre ma tenue civile</button>
                </div>
            </section>
        </div>

        <div class="lk-toast hidden" id="lkToast" role="status"></div>
    </section>
</main>
<script src="locker.js"></script>
</body>
</html>
