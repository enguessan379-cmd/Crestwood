name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Le SDK Android est déjà préinstallé sur ubuntu-latest (ANDROID_HOME).
      # L'action android-actions/setup-android échoue ("Failed to find package 'tools'")
      # avec les cmdline-tools récents, donc on utilise le sdkmanager du runner.
      - name: Install NDK + CMake + platform
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;26.2.11394342" "cmake;3.22.1" "platforms;android-36"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crestwood-debug-apk
          path: app/build/outputs/apk/debug/*.apk
